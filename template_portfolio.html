  const step = values.length > 1 ? (W - L - R) / (values.length - 1) : 0;
  for (let i = 0; i <= 3; i++) {
    const v = ymax / 3 * i, yy = y(v);
    svgEl('line', { x1: L, x2: W - R, y1: yy, y2: yy, stroke: i ? css('--grid') : css('--axis'), 'stroke-width': 1 }, svg);
    svgEl('text', { x: L - 6, y: yy + 4, 'text-anchor': 'end', 'font-size': 10, fill: css('--muted') }, svg).textContent = Math.round(v * 10) / 10;
  }
  labels.forEach((lb, i) => svgEl('text', { x: L + i * step, y: H - 6, 'text-anchor': 'middle', 'font-size': 9, fill: css('--muted') }, svg).textContent = lb);
  return { svg, y, step, L, T, H, Bm, W, R };
}
function charts(F) {
  const pd = D.perDay, pick = (d, i, tot) => F ? ((d.by && d.by[F]) || [0, 0, 0])[i] : tot;
  const labels = pd.map(d => d.label), calls = pd.map(d => pick(d, 0, d.calls)), conns = pd.map(d => pick(d, 1, d.connected)), meets = pd.map(d => pick(d, 2, d.meetings));
  if (!labels.length) return;
  let f = chartFrame($('callsChart'), calls, labels);
  const pts = calls.map((v, i) => [f.L + i * f.step, f.y(v)]);
  svgEl('path', { d: 'M' + pts.map(p => p.join(',')).join('L'), fill: 'none', stroke: css('--line'), 'stroke-width': 2, 'stroke-linejoin': 'round' }, f.svg);
  const cross = svgEl('line', { y1: f.T, y2: f.H - f.Bm, stroke: css('--axis'), 'stroke-width': 1, opacity: 0 }, f.svg);
  const dots = pts.map(([x, yy]) => svgEl('circle', { cx: x, cy: yy, r: 4, fill: css('--line'), stroke: css('--surface'), 'stroke-width': 2 }, f.svg));
  pts.forEach(([x], i) => {
    const hw = Math.max(f.step, 20) / 2;
    const hit = svgEl('rect', { x: x - hw, y: f.T, width: hw * 2, height: f.H - f.T - f.Bm, fill: 'transparent' }, f.svg);
    hit.addEventListener('mouseenter', e => { cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1); dots[i].setAttribute('r', 5);
      showTip(e, `<b>${esc(pd[i].full)}</b><br>${calls[i]} calls · ${conns[i]} connected${pd[i].src === 'attempts' ? '<br><i>from Calling Attempts</i>' : ''}<br><i>Click for details</i>`); });
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => statsPanel(pd[i].date, pd[i].date, F, `${pd[i].full}: calls per salesperson`));
    hit.addEventListener('mousemove', moveTip);
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); dots[i].setAttribute('r', 4); hideTip(); });
  });
  const mb = $('meetChart');
  f = chartFrame(mb, meets, labels);
  const bw = Math.min(26, f.step * 0.55), base = f.y(0);
  meets.forEach((v, i) => {
    const cx = f.L + i * f.step, x = cx - bw / 2, top = f.y(v), r = 4;
    const bar = v ? svgEl('path', { d: `M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${base} Z`, fill: css('--line') }, f.svg) : null;
    if (v) svgEl('text', { x: cx, y: top - 5, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 600, fill: css('--ink') }, f.svg).textContent = v;
    const hit = svgEl('rect', { x: cx - f.step / 2, y: f.T, width: f.step, height: base - f.T, fill: 'transparent' }, f.svg);
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => statsPanel(pd[i].date, pd[i].date, F, `${pd[i].full}: meetings`, { meetings: true }));
    hit.addEventListener('mouseenter', e => { if (bar) bar.setAttribute('opacity', .8); showTip(e, `<b>${esc(pd[i].full)}</b><br>${v} meetings (daily snapshots)<br><i>Click for details</i>`); });
    hit.addEventListener('mousemove', moveTip);
    hit.addEventListener('mouseleave', () => { if (bar) bar.setAttribute('opacity', 1); hideTip(); });
  });
}

/* ===================== search (deal, organisation, owner) ===================== */
let SIDX, SOWNERS;
const TAGRANK = t => { const i = ['Hot', 'Warm', 'Mild', 'Cold'].indexOf(t); return i < 0 ? 9 : i; };
function searchDeals(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  return SIDX.filter(x => toks.every(t => x.hay.includes(t))).map(x => x.d).sort((a, b) => TAGRANK(a.tag) - TAGRANK(b.tag) || (b.base || 0) - (a.base || 0));
}
let sOpts = [], sSel = -1, sQuery = '', sMatches = [];
function sRender() {
  const box = $('sres'), q = $('sq').value.trim();
  sQuery = q; sSel = -1;
  if (!q) { sClose(); return; }
  sMatches = searchDeals(q);
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  const owners = SOWNERS.filter(o => toks.every(t => o.toLowerCase().includes(t))).slice(0, 3);
  sOpts = [];
  owners.forEach(o => sOpts.push({ t: 'owner', o, html: `<b>Show all deals of ${esc(o)}</b><small>${deals.filter(d => d.bde === o).length} open deals</small>`, cls: 'act' }));
  sMatches.slice(0, 8).forEach(d => sOpts.push({ t: 'deal', id: d.id,
    html: `<b>${esc(d.org === d.name ? d.org : d.org + ' · ' + d.name)}</b><small>${esc(d.owner)} · ${esc(d.division)} · ${tagChip(d.tag)}</small>` }));
  if (sMatches.length) sOpts.push({ t: 'all', html: `<b>See all ${sMatches.length} matching deal${sMatches.length === 1 ? '' : 's'}</b><small>Opens them as a list (Enter)</small>`, cls: 'act' });
  box.innerHTML = sOpts.length ? sOpts.map((o, i) => `<div class="opt ${o.cls || ''}" role="option" data-i="${i}">${o.html}</div>`).join('') : '<div class="none">No deal, organisation or owner matches.</div>';
  box.classList.add('open'); $('sq').setAttribute('aria-expanded', 'true');
  box.querySelectorAll('.opt').forEach(n => { n.onmousedown = e => { e.preventDefault(); sPick(sOpts[+n.dataset.i]); }; });
}
function sClose() { $('sres').classList.remove('open'); $('sq').setAttribute('aria-expanded', 'false'); sSel = -1; }
function sMark() { $('sres').querySelectorAll('.opt').forEach((n, i) => { n.classList.toggle('sel', i === sSel); if (i === sSel) n.scrollIntoView({ block: 'nearest' }); }); }
function sPick(o) {
  if (!o) return;
  sClose();
  if (o.t === 'deal') openDeal(o.id);
  else if (o.t === 'owner') openDrawer({ owner: o.o });
  else openDrawer({ ids: sMatches.map(d => d.id), title: `Search: “${sQuery}”`, sub: `${sMatches.length} matching open deal${sMatches.length === 1 ? '' : 's'}` });
}
$('sq').addEventListener('input', sRender);
$('sq').addEventListener('focus', () => { if ($('sq').value.trim()) sRender(); });
$('sq').addEventListener('blur', () => setTimeout(sClose, 120));
$('sq').addEventListener('keydown', e => {
  const open = $('sres').classList.contains('open');
  if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) sRender(); else { sSel = Math.min(sSel + 1, sOpts.length - 1); sMark(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) { sSel = Math.max(sSel - 1, 0); sMark(); } }
  else if (e.key === 'Enter') {
    e.preventDefault();

    $('dtInfo').innerHTML = `<b>${esc(dayT(d))}</b> (${esc(who)}): ${e ? `${e.c} calls · ${e.k} connected (${pct(e.k, e.c)})` : 'no snapshot saved (missing, not zero)'}<br>Week ${esc(dShort(mon))}–${esc(dShort(sun))}: <b>${wc} calls · ${wk} connected</b> (${pct(wk, wc)})<button type="button" id="dtOpen">Open week table</button>`;
    $('dtOpen').onclick = () => statsPanel(mon, sun, F, `Week ${dShort(mon)}–${dShort(sun)}: per day, per salesperson`);
  }
  let moved = false;
  days.forEach((d, i) => {
    const e = by.get(d), hit = svgEl('rect', { x: X(i) - dayW / 2, y: T, width: dayW, height: H - T - Bm, fill: 'transparent' }, svg);
    hit.style.cursor = 'pointer';
    bindTip(hit, `<b>${esc(dayT(d))}</b><br>${e ? `${e.c} calls · ${e.k} connected${e.att ? '<br><i>from Calling Attempts</i>' : ''}` : 'No snapshot saved: missing, not zero'}<br><i>${esc(who)}</i>`);
    hit.addEventListener('click', () => { if (!moved) select(d); });
  });
  let down = null;
  sc.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = { x: e.clientX, l: sc.scrollLeft }; moved = false; });
  addEventListener('pointermove', e => { if (!down || !sc.isConnected) return; const dx = e.clientX - down.x; if (Math.abs(dx) > 4) { moved = true; sc.classList.add('drag'); hideTip(); } if (moved) sc.scrollLeft = down.l - dx; });
  addEventListener('pointerup', () => { if (down) { down = null; sc.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); } });
  sc.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) { const l = sc.scrollLeft; sc.scrollLeft += e.deltaY; if (sc.scrollLeft !== l) e.preventDefault(); } }, { passive: false });
  const toEnd = () => { const t = days.indexOf(PER.to < end ? PER.to : end); sc.scrollLeft = Math.max(0, Math.min(sc.scrollWidth, X(t < 0 ? days.length - 1 : t) + dayW * 2 + Rm - sc.clientWidth)); };
  toEnd(); requestAnimationFrame(toEnd);
  { const used = sc.clientWidth; const ro = new ResizeObserver(() => { if (!sc.isConnected) { ro.disconnect(); return; } if (sc.clientWidth && Math.abs(sc.clientWidth - used) > 8) { ro.disconnect(); dailyTrend(F); } }); ro.observe(sc); }
  const keep = DT_SEL && days.includes(DT_SEL) ? DT_SEL : '';
  if (keep) select(keep); else $('dtInfo').innerHTML = `<span class="muted">Click a day to see its numbers and its Monday to Sunday week. ${esc(who)}${F ? '' : ' (all salespeople)'}.</span>`;
}

/* weekly trend over all history: calls and connected as lines, meetings as bars; incomplete weeks hollow / dashed */
function trend(F) {
  const wk = ENG.weekly(F), mh = $('trendMeet');
  if (!mh || !wk.length) return;
  const W = 560, H = 200, Lm = 38, R = 14, T = 16, Bm = 34, n = wk.length;
  const x = i => Lm + (n > 1 ? (W - Lm - R) * i / (n - 1) : 0);
  const inPeriod = w => w.end >= PER.from && w.week <= PER.to;
  const tipOf = w => `<b>${esc(w.label)}</b><br>${w.calls} calls · ${w.connected} connected · ${w.meetings} meetings` +
    (w.incomplete ? `<br><i>Incomplete: ${esc(w.why)}</i>` : '') +
    (w.report ? `<br>Weekly report PDF: ${w.report.calls} calls · ${w.report.connected} connected${w.report.method === 'old' ? ' (older method)' : ''}${w.report.partial ? ' (partial week)' : ''}` : '') + '<br><i>Click for details</i>';
  function panel(hostEl, series, bars) {
    const vals = series.flatMap(s => s.v);
    const ymax = niceStep(Math.max(1, ...vals) * 1.1 / 3) * 3;
    const y = v => T + (H - T - Bm) * (1 - v / ymax);
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img' }, hostEl);
    wk.forEach((w, i) => { if (inPeriod(w)) svgEl('rect', { x: x(i) - (W - Lm - R) / Math.max(n - 1, 1) / 2, y: T, width: (W - Lm - R) / Math.max(n - 1, 1), height: H - T - Bm, fill: css('--grid'), opacity: .55 }, svg); });
    for (let i = 0; i <= 3; i++) {
      const v = ymax / 3 * i, yy = y(v);
      svgEl('line', { x1: Lm, x2: W - R, y1: yy, y2: yy, stroke: i ? css('--grid') : css('--axis'), 'stroke-width': 1 }, svg);
      svgEl('text', { x: Lm - 6, y: yy + 4, 'text-anchor': 'end', 'font-size': 10, fill: css('--muted') }, svg).textContent = Math.round(v * 10) / 10;
    }
    wk.forEach((w, i) => svgEl('text', { x: x(i), y: H - 10, 'text-anchor': 'middle', 'font-size': 9, fill: css('--muted') }, svg).textContent = fd5(w.week));
    if (bars) {
      const bw = Math.min(28, (W - Lm - R) / n * .6);
      series[0].v.forEach((v, i) => {
        const inc = wk[i].incomplete, top = y(v), base = y(0);
        svgEl('rect', { x: x(i) - bw / 2, y: top, width: bw, height: Math.max(base - top, 0), fill: inc ? 'none' : css(series[0].c), stroke: css(series[0].c), 'stroke-width': 1.5, 'stroke-dasharray': inc ? '3 2' : '' }, svg);
        if (v) svgEl('text', { x: x(i), y: top - 4, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 600, fill: css('--ink') }, svg).textContent = v;
      });
    } else {
      series.forEach(s => {
        for (let i = 1; i < n; i++) {
          const dash = wk[i].incomplete || wk[i - 1].incomplete;
          svgEl('line', { x1: x(i - 1), y1: y(s.v[i - 1]), x2: x(i), y2: y(s.v[i]), stroke: css(s.c), 'stroke-width': 2, 'stroke-dasharray': dash ? '4 3' : '' }, svg);
        }
        s.v.forEach((v, i) => svgEl('circle', { cx: x(i), cy: y(v), r: 4, fill: wk[i].incomplete ? css('--surface') : css(s.c), stroke: css(s.c), 'stroke-width': 2 }, svg));
      });
    }
    const hw = (W - Lm - R) / Math.max(n - 1, 1) / 2;
    wk.forEach((w, i) => { const hit = svgEl('rect', { x: x(i) - hw, y: T, width: hw * 2, height: H - T - Bm, fill: 'transparent' }, svg); hit.style.cursor = 'pointer'; bindTip(hit, tipOf(w)); hit.addEventListener('click', () => statsPanel(w.week, w.end, F, `Week ${w.label}: per day, per salesperson`)); });
  }
  panel(mh, [{ v: wk.map(w => w.meetings), c: '--s4' }], true);
}
const fd5 = s => dShort(s);

$('presentBtn').onclick = () => {
  const on = document.body.classList.toggle('present');
  $('presentBtn').textContent = on ? 'Exit present' : 'Present';
  if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('present')) {
    document.body.classList.remove('present'); $('presentBtn').textContent = 'Present';
  }
});
