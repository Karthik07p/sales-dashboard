<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS Sales Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #1c5cab;
    --up: #006300;
    --down: #d03b3b;
    /* deal temperature (validated: CVD + normal-vision pass; warm/mild always carry labels) */
    --hot: #c4302f;
    --warm: #ee8a6a;
    --mild: #6da7ec;
    --cold: #1c5cab;
    /* stage ramp (ordinal blue) */
    --s1: #86b6ef; --s2: #5598e7; --s3: #2a78d6; --s4: #1c5cab; --s5: #104281;
    --won: #0ca30c;
    --line: #2a78d6;
    --on-ink: #fff; --hover: #efeee9; --ink-hover: #2a2a28; --range: #dce8f8; --hero: #f4f8fe; --field: #f4f4f1;
    --warn-bg: #fff3cd; --warn-ink: #6b4e00; --warn-line: #f0d78a; --note-bg: #fff7e0; --note-ink: #5b4300;
    --shadow: rgba(11,11,11,.22); --scrim: rgba(11,11,11,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }

  /* header */
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 8px; background: var(--ink); color: var(--on-ink);
    display: grid; place-items: center; font-weight: 700; letter-spacing: .5px; font-size: 13px; flex: none; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.2px; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .badge { display: inline-block; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line);
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .actions { display: flex; gap: 8px; }
  button.btn { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); cursor: pointer; }
  button.btn:hover { background: var(--hover); }
  button.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  button.btn.primary:hover { background: var(--ink-hover); }

  /* tab bar */
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--axis); margin-bottom: 14px; position: sticky; top: 0; background: var(--page); z-index: 10; padding-top: 4px; }
  nav.tabs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-bottom: 3px solid transparent;
    padding: 9px 12px; cursor: pointer; white-space: nowrap; }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab { display: none; }
  .tab.on { display: block; }
  .tab-title { display: none; font-size: 18px; font-weight: 650; margin: 0 0 10px; }

  /* grid */
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(7, 1fr); }
  .kpis4 { grid-template-columns: repeat(4, 1fr); }
  .kpis5 { grid-template-columns: repeat(5, 1fr); }
  :root { --m1: #0f3d78; --m2: #2f7fd9; --m3: #69a3e8; --m4: #b6b5ac; }
  .track.m20 { height: 20px; }
  .mtot { font-size: 14px; font-weight: 600; color: var(--ink); margin-right: 8px; }
  .mtxt { color: var(--ink-2); }
  .mnone { font-size: 12px; color: var(--muted); margin-top: 8px; }
  table.mscore tr.mrow { cursor: pointer; }
  table.mscore tr.mrow:hover td { background: var(--grid); }
  table.mscore .mb { display: inline-block; height: 6px; border-radius: 0 3px 3px 0; background: var(--m2); vertical-align: middle; margin-left: 6px; }
  .row2 { grid-template-columns: 1fr 1.25fr; }
  .row3 { grid-template-columns: 1.25fr 1fr; }
  .row11 { grid-template-columns: 1fr 1fr; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-2); }
  .card h3 { font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: var(--ink); }
  .card .hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  section.sec { margin-top: 14px; }

  /* KPI tiles */
  .kpi .label { font-size: 12px; color: var(--ink-2); }
  .kpi .value { font-size: 28px; font-weight: 650; letter-spacing: -.5px; margin: 2px 0; overflow-wrap: anywhere; }
  .kpi .delta { font-size: 12px; color: var(--muted); }
  .kpi.kclick { cursor: pointer; }
  .kpi.kclick:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .kpi.kclick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .kpi .lk { cursor: pointer; border-bottom: 1px dotted var(--ink-2); }
  .kpi .lk:hover { background: var(--hover); }
  .kpi.two .value { font-size: 17px; line-height: 1.3; }
  .kpi.kclick .hintk { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* v2 additions */
  .how { background: var(--grid); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; font-size: 12px; color: var(--ink-2); }
  .how b { color: var(--ink); display: block; margin-bottom: 2px; }
  .tinyline { font-size: 11px; color: var(--muted); margin: 6px 0 0; }
  .kpi .lk2 { cursor: pointer; border-bottom: 1px dotted var(--muted); }
  .three { display: grid; gap: 0; }
  .three .l3 { display: grid; grid-template-columns: 90px 1fr; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--grid); cursor: pointer; font-size: 13px; align-items: baseline; }
  .three .l3:first-child { border-top: 0; }
  .three .l3:hover { background: var(--hover); }
  .three .l3 b { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .4px; }
  .dt-wrap { display: flex; align-items: flex-start; }
  .dt-y { flex: 0 0 40px; }
  .trend3 { grid-template-columns: minmax(0, 2.6fr) minmax(0, 1fr); }
  .trendhero { padding: 22px 24px 18px; border: 1px solid var(--border); box-shadow: 0 10px 30px -18px rgba(16,66,129,.45); background: linear-gradient(180deg, var(--hero) 0%, var(--surface) 38%); }
  .th-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .th-kick { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--s4); }
  .th-title { font-size: 22px; font-weight: 750; color: var(--ink); letter-spacing: -.3px; margin-top: 2px; }
  .th-leg { font-size: 13px; font-weight: 600; }
  .trendhero .solidl { border-top-width: 3px !important; } .trendhero .dotl { border-top-width: 3px !important; }
  .t3c .rowm { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .t3c .rowm .tr { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; margin-bottom: 4px; }
  .t3c .rowm .tr span { display: block; height: 100%; border-radius: 99px; }
  .t3c .rowm a { color: var(--ink-2); text-decoration: underline dotted; cursor: pointer; }
  .t3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .t3c { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px 14px; cursor: pointer; position: relative; overflow: hidden; transition: box-shadow .12s, transform .12s; }
  .t3c::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acc); }
  .t3c:hover { box-shadow: 0 6px 18px -8px rgba(0,0,0,.18); transform: translateY(-1px); }
  .t3c .lb { font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .t3c .lb i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
  .t3c .big { font-size: 28px; font-weight: 750; color: var(--ink); letter-spacing: -.5px; margin-top: 6px; line-height: 1.1; }
  .t3c .big small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
  .t3c .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .t3bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--grid); margin-top: 12px; gap: 2px; }
  .t3bar span { height: 100%; }
  .t3leg { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .t3pair { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }
  .t3pair .tr { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--grid); overflow: hidden; margin-bottom: 4px; }
  .t3pair .tr span { display: block; height: 100%; border-radius: 99px; }
  @media (max-width: 900px) { .t3 { grid-template-columns: 1fr; } }
  .trend3 > div { min-width: 0; }
  .dt-wrap { width: 100%; }
  .dt-scroll { flex: 1 1 0; width: 0; min-width: 0; overflow-x: auto; overflow-y: hidden; cursor: grab; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; }
  .dt-scroll.drag { cursor: grabbing; }
  .dt-info { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--ink-2); min-height: 20px; }
  .dt-info b { color: var(--ink); }
  .dt-info button { font: inherit; font-size: 12px; margin-left: 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; padding: 1px 8px; }
  .legend .dotl { display: inline-block; width: 22px; border-top: 2px dotted var(--s5); margin-right: 6px; vertical-align: 3px; }
  .legend .solidl { display: inline-block; width: 22px; border-top: 2px solid var(--s3); margin-right: 6px; vertical-align: 3px; }
  /* highlights */
  .highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .hl { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; font-size: 13px; }
  .hl b { display: block; font-size: 13px; }
  .hl.risk { border-color: var(--down); }
  .hl.good { border-color: var(--won); }

  /* horizontal bars */
  .hbar { display: grid; grid-template-columns: 132px 1fr 128px; align-items: center; gap: 10px; padding: 5px 0; }
  .hbar .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar .meta { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { display: flex; gap: 2px; height: 22px; align-items: stretch; }
  .seg { height: 100%; min-width: 3px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff; cursor: pointer; transition: filter .1s; overflow: hidden; }
  .seg:last-child { border-radius: 0 4px 4px 0; }
  .seg:hover { filter: brightness(1.08) saturate(1.1); outline: 2px solid var(--ink); outline-offset: 1px; }
  .seg.dark-label { color: var(--ink); }
  .clickable { cursor: pointer; border-radius: 6px; }
  .clickable:hover .name { text-decoration: underline; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .empty-note { font-size: 12px; color: var(--muted); font-style: italic; }
  .na-line { font-size: 12px; color: var(--muted); font-style: italic; border: 1px dashed var(--axis); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  .na-line b { font-style: normal; color: var(--ink-2); }
  .stage-sep { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 8px 0 0; }
  .sidelines { margin-top: 10px; border-top: 1px solid var(--grid); padding-top: 6px; }

  /* trend charts */
  .trend-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .trend-wrap h3 { font-size: 12px; font-weight: 600; margin: 0 0 4px; color: var(--ink); }
  svg text { font-family: inherit; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px;
    padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; background: var(--surface); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { min-width: 220px; max-width: 360px; color: var(--ink-2); font-size: 12px; }
  td.nw { white-space: nowrap; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--hover); }
  tbody tr.click td:first-child { font-weight: 600; }
  tfoot td { font-weight: 600; border-top: 1px solid var(--axis); }
  .tbl-scroll { overflow: auto; max-width: 100%; max-height: 440px; }
  .tbl-scroll thead th { position: sticky; top: 0; z-index: 1; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; color: #fff; white-space: nowrap; }
  .tag.Hot { background: var(--hot); } .tag.Warm { background: var(--warm); color: var(--ink); }
  .tag.Mild { background: var(--mild); color: var(--ink); } .tag.Cold { background: var(--cold); }
  .tag.Positive { background: var(--s4); } .tag.Untagged { background: var(--axis); color: var(--ink); }
  .st { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
  .st.pos { background: var(--s4); color: #fff; } .st.neg { background: var(--hot); color: #fff; }
  .st.na { background: var(--s1); color: var(--ink); } .st.oth { background: var(--axis); color: var(--ink); }
  .st.none { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .minibar { display: inline-block; height: 6px; border-radius: 0 3px 3px 0; background: var(--line); vertical-align: middle; margin-left: 6px; }
  .small { font-size: 12px; color: var(--ink-2); }
  .muted { color: var(--muted); }
  .remark { color: var(--ink-2); font-size: 12px; max-width: 260px; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  details.more { margin-top: 10px; }
  details.more > summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--accent); padding: 4px 0; }
  details.more[open] > summary { margin-bottom: 8px; }
  .hide-more tr[data-w="0"] { display: none; }

  /* period filter */
  .pbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .pbar .grp { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .pbar .grp button { font: inherit; font-size: 12px; padding: 6px 10px; border: 0; border-right: 1px solid var(--grid); background: none; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .pbar .grp button:last-child { border-right: 0; }
  .pbar .grp button:hover { background: var(--hover); }
  .pbar .grp button.on { background: var(--ink); color: var(--on-ink); }
  .pbar .cust { display: inline-flex; gap: 4px; align-items: center; position: relative; }
  .pbar .cbtn { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .pbar .cbtn:hover { background: var(--hover); }
  .pbar .cbtn.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .rp { position: fixed; z-index: 60; background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 12px; box-shadow: 0 12px 36px var(--shadow); padding: 12px; width: max-content; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; }
  .rp[hidden] { display: none; }
  .rp .rp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .rp .rp-chips .lbl { font-size: 11px; color: var(--muted); align-self: center; margin-right: 2px; }
  .rp .rchip { font: inherit; font-size: 12px; padding: 4px 9px; border: 1px solid var(--axis); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .rp .rchip:hover { background: var(--hover); }
  .rp .rchip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .rp .rp-months { display: flex; gap: 18px; }
  .rp .rp-month { width: 224px; }
  .rp .rp-head { display: flex; align-items: center; justify-content: space-between; height: 28px; margin-bottom: 4px; font-weight: 600; font-size: 13px; }
  .rp .rp-head .nav { display: inline-flex; gap: 2px; }
  .rp .rp-head button { font: inherit; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--ink); cursor: pointer; line-height: 1; }
  .rp .rp-head button:hover:not(:disabled) { background: var(--hover); }
  .rp .rp-head button:disabled { color: var(--axis); cursor: default; }
  .rp .rp-head .sp { width: 26px; height: 26px; display: inline-block; }
  .rp .rp-grid { display: grid; grid-template-columns: repeat(7, 32px); gap: 2px 0; }
  .rp .rp-dow { font-size: 10px; color: var(--muted); text-align: center; height: 20px; line-height: 20px; }
  .rp .rp-day { font: inherit; font-size: 12px; width: 32px; height: 30px; border: 0; background: none; color: var(--ink); cursor: pointer; padding: 0; border-radius: 0; }
  .rp .rp-day.blank { visibility: hidden; cursor: default; }
  .rp .rp-day.off { color: var(--axis); cursor: not-allowed; }
  .rp .rp-day.inr { background: var(--range); }
  .rp .rp-day.edge { background: var(--ink); color: var(--on-ink); }
  .rp .rp-day.edge.s { border-radius: 8px 0 0 8px; } .rp .rp-day.edge.e { border-radius: 0 8px 8px 0; } .rp .rp-day.edge.s.e { border-radius: 8px; }
  .rp .rp-day:not(.off):not(.blank):hover { outline: 1px solid var(--ink); outline-offset: -1px; }
  .rp .rp-day:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
  .rp .rp-day.today { font-weight: 700; }
  .rp .rp-fields { display: flex; gap: 8px; align-items: center; margin: 12px 0 10px; flex-wrap: wrap; }
  .rp .rp-fields label { font-size: 11px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; flex: 1 1 110px; }
  .rp .rp-fields input { font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--axis); border-radius: 8px; background: var(--field); color: var(--ink); width: 100%; min-width: 0; }
  .rp .rp-act { display: flex; gap: 8px; justify-content: flex-end; }
  .rp .rp-act button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
  .rp .rp-act button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .rp .rp-act button:disabled { opacity: .4; cursor: default; }
  .rp .rp-hint { font-size: 11px; color: var(--muted); margin: 0 0 8px; }
  @media (max-width: 480px) {
    .rp { left: 0 !important; right: 0; width: auto; max-width: none; border-radius: 0 0 12px 12px; }
    .rp .rp-months { display: block; }
    .rp .rp-month { width: 100%; }
    .rp .rp-grid { grid-template-columns: repeat(7, 1fr); }
    .rp .rp-day { width: 100%; height: 36px; }
  }
  @media (max-width: 640px) { .pbar .grp { max-width: 100%; overflow-x: auto; } }
  .dq { background: var(--note-bg); border: 1px solid var(--warn-line); color: var(--note-ink); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; font-size: 12px; }
  .dq summary { cursor: pointer; font-weight: 600; }
  .dq ul { margin: 6px 0 2px; padding-left: 18px; }
  .dq[hidden] { display: none; }
  .asof { font-size: 12px; color: var(--ink-2); margin: 0 0 10px; }
  .asof b { color: var(--ink); }
  .trend3 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
  .hollow { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--s3); border-radius: 50%; background: var(--surface); vertical-align: middle; }
  .cmpnote { font-size: 11px; color: var(--muted); }
  .delta .up { color: var(--up); font-weight: 600; } .delta .dn { color: var(--down); font-weight: 600; }

  /* header search */
  .hsearch { position: relative; flex: 1 1 280px; max-width: 420px; margin-left: auto; color: var(--ink-2); }
  .hsearch svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .hsearch input { font: inherit; font-size: 13px; width: 100%; padding: 8px 12px 8px 33px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .hsearch input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .sres { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--axis); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.16); z-index: 30; max-height: 68vh; overflow-y: auto; display: none; color: var(--ink); }
  .sres.open { display: block; }

  .sres .opt:last-child { border-bottom: 0; }

  .sres .opt small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 1px; }
  .sres .opt.act { font-weight: 600; color: var(--accent); }
  .sres .none { padding: 10px 12px; font-size: 12px; color: var(--muted); }

  /* owner filter */
  .frow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  .frow label { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .frow select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 190px; }
  .fchip { display: inline-flex; gap: 2px; align-items: center; background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 600; border-radius: 99px; padding: 3px 4px 3px 12px; }

  .kpis.compact .kpi .delta { font-size: 11px; }
  .hbar.w2 { grid-template-columns: 132px 1fr 196px; }

  .bullet { position: relative; height: 16px; background: var(--grid); border-radius: 3px; overflow: hidden; }

  .bullet.over i { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 4px, transparent 4px 8px); }
  .flag { display: inline-block; font-size: 10px; font-weight: 700; border: 1px solid var(--ink); border-radius: 99px; padding: 0 6px; margin-left: 4px; color: var(--ink); }
  .twin { display: grid; gap: 3px; position: relative; }
  .twin .track { height: 12px; }
  .twin .mk { position: absolute; top: -4px; bottom: -4px; border-left: 2px dashed var(--ink); pointer-events: none; }
  .legend .mkl { display: inline-block; width: 0; height: 12px; border-left: 2px dashed var(--ink); margin-right: 6px; vertical-align: -2px; }
  .note { border-top: 1px solid var(--grid); padding: 8px 0; }
  .note .nmeta { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .note .ntext { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note.latest .ntext { font-size: 14px; }
  .drawer h3.dh { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-2); margin: 16px 0 4px; }
  .zt.dim { opacity: .4; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* division cards */
  .divgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .dcard { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }

  .dcard .nm { font-size: 14px; font-weight: 650; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .dcard .nm span { font-size: 11px; color: var(--accent); font-weight: 600; }

  .dcard .cap { font-size: 12px; color: var(--ink-2); }
  .dcard dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; font-size: 12px; }
  .dcard dt { color: var(--ink-2); } .dcard dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .covmini { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .covmini i { display: block; height: 100%; background: var(--s4); }

  /* coverage bars */
  .cov { margin: 10px 0 14px; }
  .cov .cl { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; flex-wrap: wrap; }
  .cov .cl b { font-weight: 650; } .cov .cl span { color: var(--ink-2); font-size: 12px; }
  .covbar { position: relative; display: flex; height: 26px; background: var(--grid); border-radius: 4px; overflow: hidden; }
  .covbar .seg { cursor: pointer; border-radius: 0; }
  .covbar .seg:hover { outline-offset: -2px; }
  .covtick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .covnote { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* zones */
  .zgroup { margin: 8px 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .zt { border-radius: 8px; padding: 8px 9px; border: 1px solid var(--border); cursor: pointer; min-width: 0; background: var(--surface); }
  .zt:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .zt b { font-size: 15px; display: block; } .zt .zn { font-size: 11px; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zt .zs { margin-top: 5px; display: block; font-size: 11px; font-weight: 600; }
  .zt.pos { border-left: 5px solid var(--s4); } .zt.neg { border-left: 5px solid var(--hot); } .zt.na { border-left: 5px solid var(--s1); }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20; }

    display: flex; flex-direction: column; }

  .drawer .body { padding: 14px 20px 30px; overflow-y: auto; }

  .mini-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; margin-bottom: 14px; }

<script id="engine">
/* CubeEngine: turns HISTORY (dated events + dated snapshots) into the page's DATA object for any period [from, to].
   Ported line by line from build_dashboard_v2.py (collect + assemble) so every figure keeps its v2 / review definition.
   No DOM access: it also runs under node for the acceptance checks. */
var CubeEngine = (function () {
'use strict';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fd = ts => ts ? String(ts).slice(8, 10) + ' ' + MON[+String(ts).slice(5, 7) - 1] : '';
const fdf = ts => ts ? fd(ts) + ' ' + String(ts).slice(0, 4) : '';
const d0 = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => iso(new Date(d0(s).getTime() + n * 864e5));
const dow = s => d0(s).getUTCDay();
const dayLabel = s => DOW[dow(s)] + ' ' + (+s.slice(8, 10));
const dayFull = s => dayLabel(s) + ' ' + MON[+s.slice(5, 7) - 1];
const daysBetween = (a, b) => Math.round((d0(b) - d0(a)) / 864e5);
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const cmpArr = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) { const c = cmp(a[i], b[i]); if (c) return c; } return 0; };
const rnd1 = x => Math.round((+x || 0) * 10) / 10;
const L = x => rnd1((+x || 0) / 1e5);
const clip = (s, n) => String(s == null ? '' : s).slice(0, n);
const nl = s => String(s == null ? '' : s).replace(/\n/g, ' ');
const money_s = l => { l = rnd1(l); return l < 100 ? '₹' + l.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' L' : '₹' + (l / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Cr'; };
const BUCKET_RANK = { 'Positive': 4, 'Negative': 3, 'Not able to contact': 2, 'Contacted (no clear outcome)': 1, 'Status not reviewed': 0, 'Not attempted': 0 };
const CONVERSATION_CALL = new Set(['Answered', 'Meeting Set', 'Interested but no immediate requirement', 'Not Interested', 'Existing Solution', 'Not the right person', 'Left the Company']);
const UNREACHABLE_CALL = new Set(['No Answer', 'Wrong Number', 'No Transfer from Reception', 'Cut the Call', 'Voice Mail', 'Enquire later']);
const NO_CONTACT = /no response|not reachable|not responding|didn'?t (pick|answer|respond)|not picking|switched off|no answer|did not (pick|answer)|unreachable|not answering|busy|disconnect|tried calling|tried to call|called multiple times/i;
const HELD = /minutes of meeting|\bMOM\b|meeting attendees|we (conducted|had|met)|conducted a|visited|met with/i;
const IN_PERSON_TEXT = /in.?person|visited|visit to|at (their|the) .*office/i;
const VIRTUAL = /virtual|online|teams|zoom|google meet|webex/i;
const HELD_NOTE = /\bmet (the|with)\b|we (met|visited)|visited|meeting (was )?(held|done)|in.?person meeting/i;
const TARGETS_TXT = { };
const TAGN = { Hot: 'Hot', Warm: 'Warm', Mild: 'Mild', 'Cold/Dormant': 'Cold', Cold: 'Cold' };
const normTag = t => TAGN[t || ''] || '';
const BDE_NAMES = ['Aarav Khanna', 'Kavya Reddy', 'Arvind Subramanian', 'Rohan Deshmukh', 'Ishita Banerjee', 'Vikram Nair', 'Sneha Kulkarni', 'Ananya Iyer', 'Siddharth Rao', 'Meera Kapoor', 'Aditya Verma'];
const REGDEF = [['north', 'North Zone'], ['south', 'South Zone'], ['west', 'West Zone'], ['east', 'East Zone'], ['usa', 'USA'], ['canada', 'Canada'], ['australia', 'Australia'], ['europe', 'Europe'], ['row', 'RoW']];
const REGSUB = { north: 'North India (Delhi NCR, Uttar Pradesh, Haryana, Punjab, Rajasthan, Uttarakhand)', south: 'South India (Karnataka, Tamil Nadu, Telangana, Andhra Pradesh, Kerala)',
  west: 'West India (Maharashtra, Gujarat, Madhya Pradesh, Goa)', east: 'East and North-East India (West Bengal, Odisha, Bihar, Jharkhand, Assam)', usa: 'United States, by state',
  canada: 'Canada, by province', australia: 'Australia, by state', europe: 'UK and Europe, by country', row: 'Rest of the world (Middle East, Singapore, South Africa, Brazil, Japan, Kenya, Malaysia)' };
const REGBDE = { north: 'BDE: Aarav Khanna', south: 'BDEs: Kavya Reddy and Arvind Subramanian', west: 'BDE: Rohan Deshmukh', east: 'BDE: Ishita Banerjee', usa: 'BDEs: Vikram Nair and Sneha Kulkarni',
  canada: 'BDE: Ananya Iyer', australia: 'BDE: Siddharth Rao', europe: 'BDE: Meera Kapoor', row: 'BDE: Aditya Verma' };
const ZONE_GROUPS = null;
const col = (k, t, typ) => ({ k, t, type: typ || '' });

function create(H) {
  // ---------------------------------------------------------------- indexes (built once)
  const pullSnaps = H.deal_snapshots.filter(s => s.source === 'pull').sort((a, b) => cmp(a.as_of, b.as_of));
  const csnap = new Map(H.contact_snapshots.map(s => [s.as_of, s]));
  const P = pullSnaps.map(ps => {
    const cs = csnap.get(ps.as_of);
    return { as_of: ps.as_of, pipelines: ps.pipelines, deals: new Map(ps.deals.map(d => [d.id, d])), contacts: new Map(cs.contacts.map(c => [c.id, c])),
             inbound: cs.inbound, static: cs.static };
  });
  const tagSnaps = H.deal_snapshots.filter(s => s.source === 'daily').sort((a, b) => cmp(a.as_of, b.as_of));
  const notesByDeal = new Map(), actsByDeal = new Map(), meetsByDeal = new Map(), actsByContact = new Map();
  const push = (m, k, v) => { let a = m.get(k); if (!a) m.set(k, a = []); a.push(v); };
  H.notes.forEach(n => push(notesByDeal, n.deal_id, n));
  H.activities.forEach(a => a.deal_id != null ? push(actsByDeal, a.deal_id, a) : push(actsByContact, a.contact_id, a));
  H.meetings.forEach(a => push(meetsByDeal, a.deal_id, a));
  // last-interaction events per contact (one per distinct date; later pulls win the detail)
  const interactions = new Map();
  P.forEach(p => p.contacts.forEach(c => { if (c.li) { let m = interactions.get(c.id); if (!m) interactions.set(c.id, m = new Map()); const o = m.get(c.li); m.set(c.li, { detail: c.cs || '', seen: o ? o.seen : p.as_of }); } }));
  const users = H.users_by_id || {};
  const ovrSets = Object.entries(H.meeting_overrides || {}).map(([end, o]) => { const w = H.windows.find(x => x.end === end); return { start: w ? w.start : end, end, o }; });
  const daily = H.daily_stats;
  const dayStatus = H.day_status;
  const canonMap = H.owner_canon || {};
  // latest date the saved data knows about: a meeting dated after it (or after the period end) has not taken place yet
  const KNOW = (() => { const a = P.length ? P[P.length - 1].as_of : '', b = Object.keys(dayStatus || {}).sort().pop() || ''; return a > b ? a : b; })();

  function viewPull(to) {
    let v = null;
    for (const p of P) if (p.as_of <= to) v = p;
    return v || P[0];
  }

  // ---------------------------------------------------------------- build
  function build(from, to, opts) {
    const pv = viewPull(to), pvi = P.indexOf(pv);
    // user decisions about specific meetings (drop / set mode / count once) apply to periods overlapping the review window they were made for
    const ovr = { drop: [], set: [], count_once: [] };
    ovrSets.forEach(s => { if (s.start <= to && s.end >= from) ['drop', 'set', 'count_once'].forEach(k => (s.o[k] || []).forEach(x => ovr[k].push(x))); });
    const inw = ts => { if (!ts) return false; const d = String(ts).slice(0, 10); return from <= d && d <= to; };
    const heldCut = to < KNOW ? to : KNOW;      // a meeting dated after this has not taken place yet
    // An entry dated D that first appeared in a CRM pull later than the first pull on/after D was logged late (back-filled). By default the page shows the CRM
    // as each review saw it (late entries left out, which reproduces the saved review figures); opts.late = true includes them.
    const showLate = !!(opts && opts.late), rpc = new Map();
    const reportPull = ts => { const t = String(ts || '').slice(0, 10); let r = rpc.get(t); if (r == null) { r = '9999'; for (const p of P) if (p.as_of >= t) { r = p.as_of; break; } rpc.set(t, r); } return r; };
    const vis = (rec, ts) => showLate || !rec.seen || rec.seen <= reportPull(ts);
    const notesOf = id => (notesByDeal.get(id) || []).filter(n => vis(n, n.date));
    const actsOf = id => (actsByDeal.get(id) || []).filter(a => vis(a, a.date));
    const meetsOf = id => (meetsByDeal.get(id) || []).filter(a => vis(a, a.booked));
    // deals as of the period end: the latest pull on or before it, plus deals created later but before the end
    const dm = new Map(pv.deals);
    for (let i = pvi + 1; i < P.length; i++) P[i].deals.forEach((d, id) => { if (!dm.has(id) && d.cr <= to && !(d.status !== "Open" && (d.su || "").slice(0,10) > to)) dm.set(id, d); });
    // tags from the latest daily snapshot between the pull and the period end
    let tagOver = null;
    for (const t of tagSnaps) if (t.as_of > pv.as_of && t.as_of <= to) tagOver = t;
    const tagMap = tagOver ? new Map(tagOver.deals.map(d => [d.id, d.tag])) : null;
    const deals = [...dm.values()].map(d => tagMap && tagMap.has(d.id) && tagMap.get(d.id) !== d.tag ? { ...d, tag: tagMap.get(d.id) } : d);
    const byId = new Map(deals.map(d => [d.id, d]));
    const cm = new Map(pv.contacts);
    for (let i = pvi + 1; i < P.length; i++) P[i].contacts.forEach((c, id) => { if (!cm.has(id) && (c.cr || '0') <= to) cm.set(id, c); });
    const contacts = [...cm.values()].filter(c => !c.int);
    const cdeals = new Map();
    deals.forEach(d => d.cids.forEach(cid => push(cdeals, cid, d)));
    const staticOf = pv.static;
    const isOpen = d => d.status === 'Open';
    const tagOf = d => d.tag || '';
    const meetingMode = (owner, text) => IN_PERSON_TEXT.test(text || '') ? 'In person' : 'Virtual';
    const who = c => c.nm + (c.ds ? ', ' + c.ds : '');
    const orgOf = d => d.account || d.name;

    // ---- contact events in the period
    const cevCache = new Map();
    const cevs = c => {
      let r = cevCache.get(c.id);
      if (r) return r;
      r = [];
      const im = interactions.get(c.id);
      if (im) im.forEach((o, ts) => { if (inw(ts) && vis(o, ts)) r.push([ts, 'Interaction', o.detail]); });
      (actsByContact.get(c.id) || []).filter(a => vis(a, a.date)).forEach(a => { if (inw(a.date)) r.push([a.date, a.kind, a.text]); });
      r.sort(cmpArr);
      cevCache.set(c.id, r);
      return r;
    };
    // ---- deal events in the period
    const devCache = new Map();
    const evs = d => {
      let r = devCache.get(d.id);
      if (r) return r;
      r = [];
      notesOf(d.id).forEach(n => { if (inw(n.date)) r.push([n.date, 'Note', n.text.length > 350 ? n.text.slice(0, 350) + '…' : n.text, n.owner]); });
      let stageSeen = false;
      actsOf(d.id).forEach(a => {
        if (!inw(a.date)) return;
        if (a.kind === 'Stage change') { if (!r.some(e => e[1] === 'Stage change' && e[0] === a.date && e[2] === a.text)) { r.push([a.date, 'Stage change', a.text, '']); } stageSeen = true; }
        else r.push([a.date, a.kind, a.text, a.owner]);
      });
      meetsOf(d.id).forEach(a => { if (inw(a.booked) || inw(a.when)) r.push([inw(a.when) ? a.when : a.booked, 'Meeting', a.text, a.owner]); });
      if (inw(d.cr)) r.push([d.cr, 'Deal created', 'in ' + d.stage, d.crby]);
      if (inw(d.su) && !stageSeen && !inw(d.cr)) r.push([d.su, 'Stage change', 'to ' + d.stage, '']);
      d.cids.forEach(cid => {
        const c = cm.get(cid);
        if (c) cevs(c).forEach(([ts, kind, detail]) => { if (kind !== 'Interaction') r.push([ts, kind, c.nm + ': ' + detail, '']); });
      });
      r.sort(cmpArr);
      devCache.set(d.id, r);
      return r;
    };
    const worked = d => evs(d).length > 0;

    const lastAction = (d, long) => {
      const ev = evs(d).filter(e => e[1] !== 'Deal created');
      if (ev.length) {
        const [ts, kind, detail, by] = ev[ev.length - 1];
        const text = `${fd(ts)}: ${kind}${by ? ' by ' + by : ''}. ${nl(detail)}`;
        const n = long ? 500 : 140;
        return text.length > n ? text.slice(0, n) + '…' : text;
      }
      const note = (d.rn || '').trim(), n = long ? 500 : 120;
      return note.length > n ? `(before this period) ${note.slice(0, n)}…` : note ? `(before this period) ${note}` : `(before this period) last activity ${fd(d.lcd)}`;
    };
    const nextAction = d => {
      const open = d.tk.slice().sort((a, b) => cmp(a[0], b[0]));
      const meets = d.ap.filter(a => a[0].slice(0, 10) > to).sort((a, b) => cmp(a[0], b[0]));
      const opts = [];
      if (open.length) { const t = open[0]; opts.push([t[0], t[1] + (t[0].slice(0, 10) < to ? ' (overdue)' : '')]); }
      if (meets.length) opts.push([meets[0][0], 'Meeting: ' + meets[0][1]]);
      if (!opts.length) return ['No open task or meeting', ''];
      opts.sort(cmpArr);
      return [opts[0][1], opts[0][0] !== '9999' ? fd(opts[0][0]) : ''];
    };

    const segContacts = {};
    contacts.forEach(c => { if (c.sg) (segContacts[c.sg] = segContacts[c.sg] || []).push(c); });
    const segC = seg => segContacts[seg] || [];
    const withEv = cs => cs.filter(c => cevs(c).length);
    const best = cs => cs.length ? cs.reduce((b, c) => BUCKET_RANK[c.bk] > BUCKET_RANK[b] ? c.bk : b, cs[0].bk) : 'Not attempted';
    const bestContact = cs => { let b = null, bk = null; cs.forEach(c => { const k = [BUCKET_RANK[c.bk], c.li || '']; if (!b || cmpArr(k, bk) > 0) { b = c; bk = k; } }); return b; };
    const sumBase = ds => ds.reduce((t, d) => t + d.value, 0);
    const val = ds => sumBase(ds);

    // ---- overrides on meeting rows
    const applyOverrides = rows => {
      const out = [];
      rows.forEach(r => {
        const key = o => new RegExp(o.org, 'i').test(r[2]) && o.booked === r[0] && o.when === r[1];
        if (ovr.drop.some(key)) return;
        ovr.set.forEach(o => { if (key(o)) r[4] = o.mode; });
        out.push(r);
      });
      return out;
    };
    const meetingsOf = segf => {
      const rows = [];
      deals.forEach(d => {
        if (!d.det || !segf(d)) return;
        meetsOf(d.id).forEach(a => {
          if (inw(a.booked) || inw(a.when)) {
            const mode = meetingMode(d.owner, `${a.title || ''} ${a.location || ''}`);
            const held = ((a.when || '9').slice(0, 10) <= heldCut) ? 'Held' : 'Scheduled';
            rows.push(Object.assign([fd(a.booked), fd(a.when), orgOf(d), d.dcs || '-', mode, held, (a.title || '') + (a.desc ? '. ' + a.desc : ''), a.owner], { did: d.id }));
          }
        });
        notesOf(d.id).forEach(n => {
          if (inw(n.date) && HELD.test(n.text)) rows.push(Object.assign([fd(n.date), fd(n.date), orgOf(d), d.dcs || '-', meetingMode(d.owner, n.text), 'Held (from notes)', clip(nl(n.text), 150), n.owner], { did: d.id }));
        });
      });
      return applyOverrides(rows);
    };
    const contactMeetings = cs => {
      const rows = [];
      cs.forEach(c => {
        if (c.cs !== 'Meeting Set') return;
        const ev = cevs(c);
        if (!(inw(c.li) || ev.length)) return;
        const mailE = ev.slice().reverse().find(e => e[1] === 'Email replied');
        const mail = mailE ? mailE[2] : null;
        const note = (c.rn || '').trim();
        const purpose = clip(mail && (!note || note.startsWith('5th') || note.length > 200) ? 'Reply to meeting/demo invite: ' + mail : note || 'Meeting Set on call', 150);
        const when = c.li || (ev.length ? ev[ev.length - 1][0] : null);
        rows.push([fd(when), 'Not logged', c.ac, who(c), meetingMode(c.o), 'Scheduled', nl(purpose), c.o]);
      });
      return applyOverrides(rows);
    };
    const conversations = (seg, positiveOnly = true) => {
      const rows = [];
      segC(seg).forEach(c => {
        const ev = cevs(c);
        if (!ev.length) return;
        if (positiveOnly && c.bk !== 'Positive' && c.cs !== 'Meeting Set') return;
        const kinds = new Set(ev.map(e => e[1]));
        const channel = c.cs === 'Meeting Set' ? 'Meeting' : kinds.has('Interaction') ? 'Call' : [...kinds].some(k => k.startsWith('Email')) ? 'Mail' : 'Status update';
        const di = (cdeals.get(c.id) || []).some(d => d.di === 'Indirect') ? 'Indirect' : 'Direct';
        rows.push([fd(ev[ev.length - 1][0]), c.ac, who(c), channel, di, c.bk, clip(nl(c.rn || c.cs || ''), 200), c.o]);
      });
      deals.forEach(d => {
        if (d.division !== seg) return;
        evs(d).forEach(([ts, kind, detail, by]) => {
          if (kind === 'Note' && positiveOnly && NO_CONTACT.test(detail)) return;
          if (kind === 'Meeting' || kind === 'Note') rows.push([fd(ts), orgOf(d), d.dcs || '-', kind === 'Meeting' ? 'Meeting' : 'Call / meeting note', d.di, d.tag || d.stage, clip(nl(detail), 200), by || d.owner]);
        });
      });
      return rows.sort((a, b) => cmp(a[0], b[0]));
    };
    const positiveContacts = seg => {
      const rows = [];
      segC(seg).forEach(c => {
        if (c.bk !== 'Positive') return;
        const ev = cevs(c);
        if (!ev.length) return;
        const first = ev.find(e => e[1] === 'Lead Status');
        rows.push([c.ac, c.nm, c.ds, first ? fd(first[0]) : 'Before this period', fd(c.li), clip(nl(c.rn), 150), c.o]);
      });
      return rows;
    };
    const mrow = r => ({ booked: r[0], when: r[1], org: r[2], who: r[3], mode: r[4], held: r[5], purpose: r[6], owner: r[7], ...(r.did ? { id: r.did } : {}) });
    const crow = r => ({ date: r[0], org: r[1], who: r[2], channel: r[3], di: r[4], outcome: r[5], summary: r[6], owner: r[7] });

    // ---- deals
    const allOpen = deals.filter(isOpen);
    const sortDeals = ds => ds.slice().sort((a, b) => ((tagOf(a) !== 'Hot') - (tagOf(b) !== 'Hot')) || (b.value - a.value));
    const openHW = seg => deals.filter(d => d.division === seg && isOpen(d) && (tagOf(d) === 'Hot' || tagOf(d) === 'Warm') && worked(d));
    const valueSummary = (ds, rows = ['Direct', 'Indirect', 'Total']) => rows.map(label => {
      const x = label === 'Total' ? ds : ds.filter(d => d.di === label);
      const hot = x.filter(d => tagOf(d) === 'Hot'), warm = x.filter(d => tagOf(d) === 'Warm');
      return { row: label, hot: L(val(hot)), warm: L(val(warm)), total: L(val(x)), nHot: hot.length, nWarm: warm.length };
    });
    const dealObj = d => {
      const [nxt, by] = nextAction(d);
      return { id: d.id, org: d.account || d.name.split(' - ')[0], name: d.name, owner: d.owner, pipeline: d.pipeline, di: d.di, stage: d.stage, tag: normTag(tagOf(d)),
               v: d.fo ? null : L(d.value), foreign: d.fo, division: d.division || 'Other', last: lastAction(d), lastLong: lastAction(d, true), status: d.status, next: nxt, by, worked: worked(d), base: Math.round(d.value / 1e5 * 1e4) / 1e4, vtext: d.vt, bde: '' };
    };
    const bdeOf = n => { const x = (n || '').toLowerCase().replace(/\s+/g, ' ').trim(); for (const [b, al] of Object.entries(H.bde_aliases || {})) if (al.includes(x)) return b; return null; };

    const cnt = (o, k) => { o[k] = (o[k] || 0) + 1; };
    // ================= regional (fill_regional.py) =================
    const userNames = [...new Set(Object.values(users))];
    function regional(part, virtualOrgs, region, bdeLabel, pc, pd) {   // pc / pd: contact / deal predicates that replace the owner match (North Zone is by tag, not by owner)
      const re = new RegExp(part, 'i');

          const key = once ? org + '|' + wn : org + '|' + wn + '|' + who;
          const status = !wn ? 'Date missing' : wn > heldCut ? 'Upcoming' : wn < from ? 'Held earlier' : 'Held';
          const r = { id: d.id, kind, bookedISO: bookedTs || '', whenISO: whenTs || '', owner: owner || d.owner, org, deal: d.name, who, division: d.division || 'Other', type, mode, purpose, status };
          // bucket (each meeting connected to the period lands in exactly one): h1 held, booked in the period; h2 held, booked earlier; up upcoming, booked in the period;
          // nl booked in the period, date already passed (or missing) but not counted as held (dated before the period, or no date)
          const heldHere = !!wn && inw(wn) && wn <= heldCut, bkIn = inw(bk);

          const put = (list, set) => { if (set.has(key)) return; set.add(key); list.push(r); };
          if (r.bucket === 'nl') put(out.nl, seen.n);
          if (kind === 'appt' && inw(bk)) put(out.booked, seen.b);
          if (wn && inw(wn) && wn <= heldCut) put(out.held, seen.h);
          if (kind === 'appt' && wn > heldCut && bk && bk <= to) put(out.upcoming, seen.u);
        };
        meetsOf(d.id).forEach(a => add('appt', a.booked, a.when, a.owner, a.title || 'Meeting', meetingMode(d.owner, `${a.title || ''} ${a.location || ''}`), (a.title || '') + (a.desc ? '. ' + a.desc : '')));
        notesOf(d.id).forEach(n => { if (inw(n.date) && HELD.test(n.text)) add('note', n.date, n.date, n.owner, 'Meeting minutes (from a note)', meetingMode(d.owner, n.text), clip(nl(n.text), 150)); });
      });
      out.booked.sort((a, b) => cmp(b.bookedISO, a.bookedISO));
      out.held.sort((a, b) => cmp(b.whenISO, a.whenISO));
      out.upcoming.sort((a, b) => cmp(a.whenISO, b.whenISO));

    };
    const meet2 = meetRecs();
    // deals that are not open (closed, or worked and since closed) still need a detail record so that a list row can open them
    const openIdSet = new Set(allOpen.map(d => d.id)), need = new Set();
    [...updated, ...won, ...lost].forEach(d => need.add(d.id));
    ['booked', 'held', 'upcoming', 'nl'].forEach(k => meet2[k].forEach(r => need.add(r.id)));
    const extraOut = [...need].filter(id => !openIdSet.has(id)).map(id => byId.get(id)).filter(Boolean).map(d => {
      const o = dealObj(d); o.bde = bdeOf(o.owner) || o.owner; const [n, a, h] = dealNotes(d); o.notes = n; o.acts = a; o.hist = +h; o.divs = []; return o;
    });
    const closedList = ds => ds.map(d => ({ id: d.id, date: String(closedOn(d) || '').slice(0, 10), v: L(d.value) })).sort((a, b) => cmp(b.date, a.date));
    const cm0 = ownerCanonMap(dealsOut);
    const data = {
      week: weekText, prepared: 'Karthik Pandurangan', generated: '', window: { start: from, end: to, text: `${fd(from)} to ${fd(to)} ${to.slice(0, 4)}`, short },
      notes, bdes, deals: dealsOut, foreignN, expectedCalls: 75,
      updated: { n: updated.length, open: updatedOpen.length, by: byOwner(updated), openBy: byOwner(updatedOpen), ids: updated.map(d => d.id) },
      won: { n: won.length, v: rnd1(won.reduce((t, d) => t + d.value, 0) / 1e5), by: byOwner(won, true), list: closedList(won) }, lost: { n: lost.length, v: rnd1(lost.reduce((t, d) => t + d.value, 0) / 1e5), by: byOwner(lost, true), list: closedList(lost) },
      meet: { cut: heldCut, ...meet2 }, extra: extraOut,
      ownerCanon: cm0, dormant: { n: dorm.length, v: rnd1(dorm.filter(o => !o.foreign).reduce((t, o) => t + (o.v || 0), 0)) },
      stages: stageRows, perDay, dayNote: dq.dayNote, highlights,
      meetHeld: { hint: 'Appointments dated in the window plus meeting minutes in deal notes, all sectors and zones, counted once.', rows: allHeld.map(mrow) },
      divisions, divNote: 'Hot + Warm value counts the Hot and Warm deals worked in the period. Regions are by the account location, so they do not overlap. Deals in other currencies are converted to rupees at a fixed rate.',
      quality: dq, asOf: { pull: pv.as_of, tags: tagOver ? tagOver.as_of : null } };
    return data;
  }

  function ownerCanonMap(dealsOut) {
    const names = new Set(Object.values(users)); dealsOut.forEach(o => names.add(o.owner));
    const out = {};
    [...names].filter(Boolean).sort().forEach(n => { out[n] = canonMap[n] || bdeOfName(n) || n; });
    return out;
  }
  function bdeOfName(n) { const x = (n || '').toLowerCase().replace(/\s+/g, ' ').trim(); for (const [b, al] of Object.entries(H.bde_aliases || {})) if (al.includes(x)) return b; return null; }

  // ---------------------------------------------------------------- data quality of a period
  function weekdayList(from, to) { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) if (dow(d) >= 1 && dow(d) <= 5) out.push(d); return out; }
  function dayState(d) {
    const s = dayStatus[d];
    if (s) return s.s === 'stats' ? { k: s.method === 'old' ? 'old' : 'ok' } : { k: s.s, from: s.span_from };
    return { k: 'missing' };
  }
  function dataQuality(from, to) {
    const dates = Object.keys(dayStatus).sort();
    const first = dates[0], last = dates[dates.length - 1];
    const q = { missing: [], old: [], attempts: [], multi: [], baseline: [], beyond: [], notes: [], complete: true, dayNote: 'days with a snapshot only' };
    weekdayList(from, to).forEach(d => {
      if (d > last) { q.beyond.push(d); return; }
      if (d < first) { q.missing.push(d); return; }
      const st = dayState(d);
      if (st.k === 'missing') q.missing.push(d); else if (st.k === 'old') q.old.push(d); else if (st.k === 'attempts') q.attempts.push(d); else if (st.k === 'multi') q.multi.push(d); else if (st.k === 'baseline') q.baseline.push(d);
    });
    const list = a => a.map(dayFull).join(', ');
    if (q.multi.filter(d => d <= '2026-10-15').length) q.notes.push(`${list(q.multi.filter(d => d <= '2026-10-15'))}: the first snapshot after the baseline spans several days, so no single-day call figure exists; the day is left out of the totals.`);
    if (q.baseline.filter(d => d <= '2026-10-15').length) q.notes.push(`${list(q.baseline.filter(d => d <= '2026-10-15'))}: baseline snapshot, no call stats.`);
    if (q.attempts.filter(d => d <= '2026-10-15').length) q.notes.push(`${list(q.attempts.filter(d => d <= '2026-10-15'))}: no saved call stats; calls and connected are the rise in Calling Attempts since the previous snapshot (meetings not available for those days).`);
    if (q.old.filter(d => d <= '2026-10-15').length) q.notes.push(`${list(q.old.filter(d => d <= '2026-10-15'))}: counted with the older method of the 24 Oct weekly report (Calling Attempts rise only), so these days are not comparable with later weeks.`);
    if (q.beyond.length) q.notes.push(`${list(q.beyond)}: after the last saved snapshot (${fdf(last)}), so not included yet.`);
    q.complete = !(q.missing.length || q.multi.length || q.baseline.length || q.attempts.length || q.old.length || q.beyond.length);
    const att = [];
    for (let d = from; d <= to; d = addDays(d, 1)) if (dayStatus[d] && dayStatus[d].s === 'attempts') att.push(dayFull(d));
    if (att.length) q.dayNote += '; ' + att.join(', ') + ' come from Calling Attempts';
    if (from <= '2026-10-31' && to >= '2026-11-01' && !dayStatus['2026-10-31'] && !dayStatus['2026-11-01']) q.dayNote += '; Sat 31 Oct and Sun 1 Nov have no snapshot (weekend), so they are not shown';
    q.cmp = comparison(from, to);
    return q;
  }
  // previous equal-length period: comparable only if every weekday there has full current-method stats
  function comparison(from, to) {
    const n = daysBetween(from, to) + 1, pt = addDays(from, -1), pf = addDays(pt, -(n - 1));
    const wd = weekdayList(pf, pt);
    const sums = { calls: 0, connected: 0, meetings: 0 };
    const label = `${fd(pf)}–${fd(pt)}`;
    if (!wd.length) return { ok: false, label, why: 'no comparable period' };
    for (const d of wd) { const st = dayState(d); if (st.k !== 'ok') return { ok: false, label, why: 'no comparable period' }; }
    const by = {};
    daily.forEach(r => { if (r.date >= pf && r.date <= pt && r.src === 'stats') ['calls', 'connected', 'meetings'].forEach(k => { sums[k] += +r[k] || 0; const e = by[r.owner] || (by[r.owner] = { calls: 0, connected: 0, meetings: 0 }); e[k] += +r[k] || 0; }); });
    return { ok: true, label, from: pf, to: pt, ...sums, by };
  }

  // ---------------------------------------------------------------- weekly trend (all history)
  function weekly(owner) {
    const dates = Object.keys(dayStatus).sort();
    if (!dates.length) return [];
    const mondayOf = d => addDays(d, -((dow(d) + 6) % 7));
    const out = [];
    const lastDay = dates[dates.length - 1];
    for (let w = mondayOf(dates[0]); w <= lastDay; w = addDays(w, 7)) {
      const we = addDays(w, 6), row = { week: w, end: we, calls: 0, connected: 0, meetings: 0, bad: [], approx: false, old: false, label: `${fd(w)}–${fd(we)}` };
      weekdayList(w, we).forEach(d => {
        const st = d > lastDay ? { k: 'beyond' } : dayState(d);
        if (st.k !== 'ok' && st.k !== 'old' && st.k !== 'attempts') row.bad.push(d);
        if (st.k === 'old') row.old = true;
        if (st.k === 'attempts') row.approx = true;
      });
      daily.forEach(r => { if (r.date >= w && r.date <= we && (r.src === 'stats' || r.src === 'attempts') && (!owner || r.owner === owner)) ['calls', 'connected', 'meetings'].forEach(k => row[k] += +r[k] || 0); });
      row.incomplete = row.bad.length > 0 || row.approx || row.old;
      row.why = [row.bad.length ? `${row.bad.length} weekday(s) without usable stats` : '', row.approx ? 'some days from Calling Attempts' : '', row.old ? 'older counting method' : ''].filter(Boolean).join('; ');
      const rep = (H.weekly_reports || []).find(r => r.week_start === w);
      if (rep && !owner) { row.report = { calls: Object.values(rep.bdes).reduce((t, b) => t + b.calls, 0), connected: Object.values(rep.bdes).reduce((t, b) => t + b.connected, 0), n: Object.keys(rep.bdes).length, method: rep.method, partial: rep.partial }; }
      out.push(row);
    }
    return out;
  }
  return { build, weekly, dataQuality, viewPull: to => viewPull(to).as_of, pulls: () => P.map(p => p.as_of) };
}
return { create };
})();

<script>

  const f = p.get('from'), t = p.get('to'); return f && t && /^\d{4}-\d\d-\d\d$/.test(f) && /^\d{4}-\d\d-\d\d$/.test(t) && f <= t ? { from: f, to: t } : { from: w.start, to: w.end }; })();

  'Opportunity': 'pos', 'Enquire later': 'oth', 'Held': 'pos', 'Upcoming': 'na', 'Held earlier': 'oth', 'Date missing': 'none', 'Won': 'pos', 'Lost': 'neg', 'Open': 'na' };

/* ===================== owner filter (state per tab, kept in the URL hash) ===================== */
let VIEWMODE = (() => { try { return new URLSearchParams((location.hash.slice(1).split('?')[1]) || '').get('view') === 'summary' ? 'summary' : 'detail'; } catch (e) { return 'detail'; } })();   // 'detail' | 'summary'

const OWNERS_CACHE = {};

    rows.map(r => `<tr${r.id ? ` class="click" data-deal="${r.id}"` : ''}${r._w != null ? ` data-w="${r._w}"` : ''}>${cols.map(c => cell(c, r)).join('')}</tr>`).join('')}</tbody>${o.foot || ''}</table>`;
}
const scroll = html => `<div class="tbl-scroll">${html}</div>`;
const card = (title, hint, body, cls = '') => `<div class="card ${cls}"><h2>${esc(title)}</h2>${hint ? `<div class="hint">${esc(hint)}</div>` : ''}${body}</div>`;
const more = (n, html) => `<details class="more"><summary>Show all (${n})</summary>${html}</details>`;

/* ===================== coverage bars ===================== */
const SEGCOL = { pos: '--s4', neg: '--hot', na: '--s1', other: '--axis', none: '--grid', yes: '--s4', no: '--grid', opp: '--s5', later: '--mild' };
const SEGLAB = { pos: 'Positive', neg: 'Negative', na: 'Not able to contact', other: 'Contacted, no clear outcome', none: 'Not attempted', yes: 'Yes', no: 'No', opp: 'Opportunity', later: 'Enquire later' };
/* Redraws a coverage bar from its [owner, status] units, for one salesperson (F) or the whole team (F = ''). Same rules as the builder. */
function calcCov(bar, F) {
  const U = F ? bar.units.filter(u => canon(u[0]) === F) : bar.units;

  if (bar.kind === 'target') {
    const total = bar.total, pos = cnt('pos'), neg = cnt('neg'), na = cnt('na'), oc = cnt('oc'), nr = cnt('nr'), other = oc + nr, crm = U.length;
    const att = Math.min(pos + neg + na + other, total), over = crm > total;

    if (over) return { ...base, scale: crm, segs: [['pos', pos], ['neg', neg], ['na', na], ['other', other]], tick: total, text: `${crm} ${bar.unit} in CRM · target ${total}`,
      note: `The CRM holds more than the target, so every target is covered (black tick = target). ${detail}.`, att, att0: pos + neg + na + other, tot: total, over: true };
    return { ...base, scale: total, segs: [['pos', pos], ['neg', neg], ['na', na], ['other', other], ['none', Math.max(total - pos - neg - na - other, 0)]],
      text: `${att} of ${total} attempted`, note: `${crm} ${bar.unit} in CRM. ${detail}.`, att, att0: pos + neg + na + other, tot: total, over: false };
  }
  if (bar.kind === 'me') {

    return { ...base, scale: total || 1, segs: [['pos', pos], ['neg', neg], ['other', other], ['none', none]], text: `${contacted} of ${total} contacted · ${pos} positive · ${neg} negative`,

  }

  return { ...base, scale: total || 1, segs: [['opp', opp], ['pos', pos], ['neg', neg], ['na', na], ['later', later], ['other', other]],
    text: `${total} approached · ${opp} opportunity · ${pos} positive`, note: bar.note, att: total, att0: total, tot: total, over: false, opp, pos, neg };
}
function covBarsFor(dv, F) {
  let teamWide = false;
  const bars = dv.coverage.map(b => {
    if (F && !b.exact) { teamWide = true; return { ...calcCov(b, ''), tw: true }; }
    return calcCov(b, F);
  });

}
function covBar(c, bi) {
  const scale = c.scale || 1;
  const segs = c.segs.filter(s => s[1] > 0).map(([k, n]) => {
    const w = n / scale * 100;
    const dark = k === 'na' || k === 'other' || k === 'none' || k === 'no';
    return `<div class="seg ${dark ? 'dark-label' : ''}" data-k="${k}" data-n="${n}" style="width:${w}%;background:var(${SEGCOL[k]})">${w > 7 ? n : ''}</div>`;
  }).join('');

const covLegend = ks => `<div class="legend">${ks.map(k => `<span><i style="background:var(${SEGCOL[k]});${k === 'none' || k === 'no' ? 'border:1px solid var(--axis)' : ''}"></i>${SEGLAB[k]}</span>`).join('')}</div>`;

/* ===================== deals (Hot & Warm) ===================== */
const DEALCOLS = [{ k: 'owner', t: 'Owner', type: 'nw' }, { k: 'org', t: 'Organization / project' }, { k: 'stage', t: 'Stage', type: 'nw' },
  { k: 'tag', t: 'Tag', type: 'tag' }, { k: 'val', t: 'Value', type: 'nw' }, { k: 'last', t: 'Latest activity', type: 'wrap' }, { k: 'next', t: 'Next step', type: 'wrap' }];
function dealRow(ref, w, F) {
  const d = byId.get(ref.id);

  return { id: d.id, owner: d.owner.split(' ')[0], org: d.org === d.name ? d.org : `${d.org} · ${d.name}`, stage: d.stage || '—', tag: ref.tag || d.tag,
    val: valueCell(d), last: d.last, next: (d.next || '') + (d.by ? ' · ' + d.by : ''), _w: w };
}
function workedDeals(dv, F) { return dv.deals.worked.map(r => byId.get(r.id)).filter(d => d && own(d.owner, F)); }

  const A = dv.deals;
  const worked = A.worked.map(r => dealRow(r, 1, F)).filter(Boolean), rest = A.more.map(r => dealRow(r, 0, F)).filter(Boolean);

  const chips = rest.length ? `<div class="chips"><button class="chip ${mode === 'w' ? 'on' : ''}" data-v="w">Worked ${SHORT} (${worked.length})</button><button class="chip ${mode === 'a' ? 'on' : ''}" data-v="a">All open (${worked.length + rest.length})</button></div>` : '';
  let body = chips + `<div class="tbl-scroll">${worked.length || rest.length ? `<div id="${id}" class="${mode === 'w' ? 'hide-more' : ''}">${table(DEALCOLS, [...worked, ...rest])}</div>` : `<div class="empty-note">No Hot or Warm deals${F ? ' for this salesperson' : ''}.</div>`}</div>`;
  if (!worked.length && rest.length) body += `<div class="empty-note">None of these were worked in the window.</div>`;
  if (A.sumRows && A.sumRows.length) {
    const wd = workedDeals(dv, F).filter(isHW);
    const rows = A.sumRows.map(label => {
      const ds = label === 'Total' ? wd : wd.filter(d => d.di === label);
      const h = ds.filter(d => d.tag === 'Hot'), w = ds.filter(d => d.tag === 'Warm');
      return { row: label, hot: money(bs(h)), warm: money(bs(w)), total: money(bs(ds)), rem: `${h.length} hot, ${w.length} warm` };
    });
    body += `<h3>Pipeline value of the ${SHORT} Hot and Warm deals</h3>` + scroll(table(
      [{ k: 'row', t: 'Row' }, { k: 'hot', t: 'Hot', type: 'num' }, { k: 'warm', t: 'Warm', type: 'num' }, { k: 'total', t: 'Total', type: 'num' }, { k: 'rem', t: 'Deals' }], rows));

/* ===================== lists, meetings, conversations ===================== */
function listCard(t, F) {  // {title, hint, cols, rows, empty, expandAfter}
  const rows = hasOwnerCol(t.cols) ? keepRows(t.rows, F) : t.rows;
  if (!rows.length) return card(t.title + (t.count ? ' (0)' : ''), t.hint, (t.summary || '') + (t.na && !F ? NR(t.empty || '') : `<div class="empty-note">${esc(F ? 'None for this salesperson.' : (t.empty || 'None.'))}</div>`));
  const cols = t.cols;
  const main = rows.slice(0, t.expandAfter || 1e9), rest = rows.slice(t.expandAfter || 1e9);
  let body = scroll(table(cols, main));
  if (rest.length) body += more(rest.length, scroll(table(cols, rest)));
  return card(t.title + (t.count ? ` (${rows.length})` : ''), t.hint, (t.summary || '') + body);
}
const MCOLS = [{ k: 'booked', t: 'Booked', type: 'nw' }, { k: 'when', t: 'Meeting date', type: 'nw' }, { k: 'org', t: 'Organization' }, { k: 'who', t: 'Contact', type: 'wrap' },
  { k: 'mode', t: 'Mode', type: 'nw' }, { k: 'held', t: 'Status', type: 'nw' }, { k: 'purpose', t: 'Purpose / outcome', type: 'wrap' }, { k: 'owner', t: 'Owner', type: 'nw' }];

  { k: 'di', t: 'Direct / Indirect', type: 'nw' }, { k: 'outcome', t: 'Outcome', type: 'nw' }, { k: 'summary', t: 'Summary', type: 'wrap' }, { k: 'owner', t: 'Owner', type: 'nw' }];
const smallLine = h => `<div class="small" style="margin-bottom:8px">${h}</div>`;
function meetSummary(kind, rows) {
  const held = rows.filter(isHeld);

  if (kind === 'mode') {
    const v = rs => rs.filter(r => r.mode === 'Virtual').length, p = rs => rs.filter(r => r.mode === 'In person').length;

/* filters one extras block for a salesperson (blocks without an owner column stay team-wide) */
function filterBlock(b, F) {

  if (b.type === 'indirect') {
    const g = b.group, all = g.all.filter(u => canon(u[0]) === F), rows = keepRows(g.rows, F);
    return { ...b, group: { ...g, rows, total: all.length, auth: sum(all, u => u[1]), con: sum(all, u => u[2]), nListed: rows.length } };
  }
  if (b.type === 'group' || b.type === 'cols') return { ...b, blocks: b.blocks.map(x => filterBlock(x, F)) };

}
/* extras: one renderer per block type */
function extraBlock(b, F, dv) {

    let h = '<div class="legend">' + [['pos', 'Positive'], ['neg', 'Negative'], ['na', 'Not able to contact'], ['oth', 'Contacted / not reviewed'], ['none', 'Not attempted']]

    for (const g of b.groups) {
      h += `<div class="zgroup">${esc(g.name)} (${g.tiles.length} zones)</div><div class="zones">` + g.tiles.map((t, i) => {

        return `<div class="zt ${cls}${F && !ids.length ? ' dim' : ''}" data-g="${esc(g.name)}" data-i="${i}"><b>${esc(t.code)}</b><span class="zn">${esc(t.name)}</span><span class="zs">${esc(t.status)}</span><span class="small">${ids.length} open deal${ids.length === 1 ? '' : 's'}</span></div>`;
      }).join('') + '</div>';
    }
    return `<div class="card zonecard"><h2>${esc(b.title)}</h2><div class="hint">${esc(b.hint)}</div>${h}${F ? `<div class="covnote">Zone status is team-wide; the deal counts show ${esc(F)}'s open deals only.</div>` : ''}</div>`;
  }

  if (b.type === 'group') return `<div class="card"><h2>${esc(b.title)}</h2><div class="hint">${esc(b.hint || '')}</div><div class="grid" style="gap:14px">${filterBlock(b, F).blocks.map(x => extraBlock(x, F, dv)).join('')}</div></div>`;
  if (b.type === 'indirect') {

    const s = `<div class="small" style="margin-bottom:8px"><b>${g.total}</b> ${esc(g.stage.toLowerCase())} projects · authority contacted <b>${g.auth} of ${g.total}</b> · contractor contacted <b>${g.con} of ${g.total}</b>.

      { k: 'c', t: 'Contractor contacted?', type: 'nw' }, { k: 'tag', t: 'Tag', type: 'tag' }, { k: 'remarks', t: 'Remarks', type: 'wrap' }, { k: 'last', t: 'Last week action', type: 'wrap' },
      { k: 'next', t: 'Next action', type: 'wrap' }, { k: 'owner', t: 'Owner', type: 'nw' }];
    const rows = g.rows.map(r => ({ id: r.id, project: r.project, authority: r.authority, a: r.authYes ? 'Yes' + (r.authStatus ? ` (${r.authStatus})` : '') : 'No', contractor: r.contractor,
      c: r.conYes ? 'Yes' : 'No', tag: r.tag, remarks: r.remarks, last: r.last, next: r.next, owner: r.owner }));
    return card(b.title, b.hint, s + (rows.length ? scroll(table(cols, rows)) : '<div class="empty-note">None worked in the window.</div>'));

function ctrSummary(t, F) {   // Contractors: companies tried, counted from the rows on show

/* ===================== KPI strip (recomputed for the salesperson on show) ===================== */
function bindKpis(root, handlers) {

function kpisFor(dv, F) {

/* ===================== division tab: KPIs, meetings, Hot & Warm, conversations, extras, coverage, appendix ===================== */
function renderDivision(dv) {

/* ===================== click-through panels: the records behind a number or a chart mark ===================== */
const tagRank = t => { const i = ['Hot', 'Warm', 'Mild', 'Cold'].indexOf(t); return i < 0 ? 9 : i; };
const wdayName = s => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][isoDow(s)];
const dayT = s => `${wdayName(s)} ${dFull(s)}`;
const pctT = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const forPerson = F => F ? ` · ${F}` : ' · all salespeople';

/* calls / connected / meetings per salesperson and per day (from the daily snapshots) for any range */
function statsPanel(from, to, F, title, o = {}) {
  const cmpRow = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.owner.localeCompare(b.owner);
  let rows = HISTORY.daily_stats.map(r => ({ ...r })).filter(r => r.date >= from && r.date <= to && (r.src === 'stats' || r.src === 'attempts') && (!F || r.owner === F) && (!o.owners || o.owners.has(r.owner)) && (r.calls || r.connected || r.meetings)).sort(cmpRow);
  const T = { c: 0, k: 0, m: 0 }, per = {};
  if (o.div) rows.forEach(r => { r.calls = splitN(r.calls, r.date, r.owner, o.div); r.connected = splitN(r.connected, r.date, r.owner, o.div); });
  rows = rows.filter(r => !o.div || r.calls || r.connected || r.meetings);
  rows.forEach(r => {
    const c = +r.calls || 0, k = +r.connected || 0, m = +r.meetings || 0;
    T.c += c; T.k += k; T.m += m;
    const e = per[r.owner] || (per[r.owner] = { owner: r.owner, calls: 0, connected: 0, meetings: 0 });
    e.calls += c; e.connected += k; e.meetings += m;
  });
  const note = r => r.src === 'attempts' ? 'from Calling Attempts' : (HISTORY.day_status[r.date] && HISTORY.day_status[r.date].method === 'old' ? 'older counting method' : '');
  const sums = (a, b, c) => `<td class="num">${a}</td><td class="num">${b}</td><td class="num">${pctT(b, a)}</td><td class="num">${c}</td>`;
  const sections = [];
  const owners = Object.values(per).sort((a, b) => b.calls - a.calls);
  if (owners.length > 1 || from !== to) sections.push({ title: 'By salesperson', cols: [{ k: 'owner', t: 'Salesperson', type: 'nw' }, { k: 'calls', t: 'Calls', type: 'num' }, { k: 'connected', t: 'Connected', type: 'num' }, { k: 'rate', t: 'Connect rate', type: 'num' }, { k: 'meetings', t: 'Meetings (snapshots)', type: 'num' }],
    rows: owners.map(e => ({ owner: e.owner, calls: e.calls, connected: e.connected, rate: pctT(e.connected, e.calls), meetings: e.meetings })), foot: `<tfoot><tr><td>Total</td>${sums(T.c, T.k, T.m)}</tr></tfoot>`, count: false });
  sections.push({ title: 'Per day, per salesperson', cols: [{ k: 'date', t: 'Day', type: 'nw' }, { k: 'owner', t: 'Salesperson', type: 'nw' }, { k: 'calls', t: 'Calls', type: 'num' }, { k: 'connected', t: 'Connected', type: 'num' }, { k: 'rate', t: 'Connect rate', type: 'num' },
    { k: 'meetings', t: 'Meetings (snapshots)', type: 'num' }, { k: 'note', t: 'Note', type: 'wrap' }],
    rows: rows.map(r => ({ date: dayT(r.date), owner: r.owner, calls: r.calls, connected: r.connected, rate: pctT(r.connected, r.calls), meetings: r.meetings == null ? '—' : r.meetings, note: note(r) })),
    foot: `<tfoot><tr><td colspan="2">Total</td>${sums(T.c, T.k, T.m)}<td></td></tr></tfoot>`, empty: 'No daily snapshot stats were saved for this range.', count: false });
  if (o.meetings) {
    const ms = D.meet.held.filter(r => r.whenISO.slice(0, 10) >= from && r.whenISO.slice(0, 10) <= to && own(r.owner, F));
    sections.push({ title: 'Meetings dated in this range (CRM records)', cols: MH_COLS, rows: ms.map(mDisp), empty: 'No held meeting is dated in this range.' });
  }
  openPanel({ title, sub: (from === to ? dayT(from) : `${dFull(from)} to ${dFull(to)}`) + (o.label ? ' · ' + o.label : forPerson(F)), sections,
    kpis: [['Calls', T.c], ['Connected', T.k], ['Connect rate', pctT(T.k, T.c)], ['Meetings (snapshots)', T.m]],
    note: 'Daily snapshot figures. Days without a saved snapshot are not listed (missing, not zero).' });
}

/* deals */
const DP_COLS = [{ k: 'owner', t: 'Owner', type: 'nw' }, { k: 'org', t: 'Account / deal' }, { k: 'stage', t: 'Stage', type: 'nw' }, { k: 'status', t: 'Status', type: 'st' },
  { k: 'tag', t: 'Tag', type: 'tag' }, { k: 'val', t: 'Value', type: 'nw' }, { k: 'last', t: 'Latest activity', type: 'wrap' }];
const dpRow = d => ({ id: d.id, owner: d.owner.split(' ')[0], org: dealLabel(d), stage: d.stage || '—', status: d.status || 'Open', tag: d.tag, val: valueCell(d), last: d.lastLong || d.last });
function updatedPanel(F) {

    sections: [{ title: 'Deals touched in the period', cols: DP_COLS, rows: ds.map(dpRow), empty: 'No deal was touched in the period.' }] });

  { k: 'next', t: 'Next action', type: 'wrap' }, { k: 'owner', t: 'Owner', type: 'nw' }];
const indRows = g => g.rows.map(r => ({ id: r.id, project: r.project, authority: r.authority, a: r.authYes ? 'Yes' + (r.authStatus ? ` (${r.authStatus})` : '') : 'No', contractor: r.contractor,
  c: r.conYes ? 'Yes' : 'No', tag: r.tag, remarks: r.remarks, last: r.last, next: r.next, owner: r.owner }));
function covPanel(dv, F, bar, segKey) {

  secs.push({ title: 'Coverage figures', cols: [{ k: 'list', t: 'List' }, { k: 'att', t: 'Attempted', type: 'num' }, { k: 'split', t: 'Outcome', type: 'wrap' }],
    rows: shown.map(b => ({ list: b.label, att: b.att0, split: b.segs.filter(x => x[0] !== 'none' && x[1]).map(([k, n]) => `${SEGLAB[k]} ${n}`).join(' · ') || '—' })), count: false });
  const sel = segKey && SEGMATCH[segKey];
  const none = segKey === 'none' || segKey === 'no';
  if (none) secs.push({ title: 'Not attempted', rows: [], empty: 'Organisations or contacts not yet attempted are not individually named in the saved data.' });
  dv.appendix.forEach(a => {
    let rs = keepRows(a.rows, F);
    if (sel && a.cols.some(c => c.k === 'st')) rs = rs.filter(r => sel.test(r.st || ''));
    if (!none) secs.push({ title: a.title.trim(), hint: a.feeds, cols: a.cols, rows: rs, empty: 'None for this selection.' });
  });
  dv.extras.filter(e => e.type === 'table' && e.title.startsWith('Organisations approached')).forEach(e => {
    let rs = keepRows(e.rows, F);
    if (sel) rs = rs.filter(r => sel.test(r.st || ''));
    secs.push({ title: e.title, cols: e.cols, rows: rs, empty: 'None for this selection.' });
  });
  if (dv.key === 'indirect') {
    const which = bar && /contractor/i.test(bar.label) ? 'c' : 'a';
    dv.extras.filter(e => e.type === 'indirect').forEach(e => {
      const g = filterBlock(e, F).group;
      let rows = indRows(g);
      if (segKey === 'yes' || segKey === 'no') rows = rows.filter(r => (r[which] !== 'No') === (segKey === 'yes'));
      secs.push({ title: e.title, hint: 'Projects worked in the window (the list does not name projects that were not worked).', cols: INDCOLS, rows, empty: 'None in the window.' });
    });

  openPanel({ title: `${dv.name}: ${segKey ? SEGLAB[segKey] || 'coverage' : 'attempted'}`, sub: (bar ? bar.label : 'All lists') + forPerson(F), sections: secs,

/* shared row builders for the overview charts */

}
const INR_ONLY = {};   // deals in each deal's own currency: only rupee deals are added

}

}
function chartHW(F) {

/* attempted per division on a common scale; no targets. Bar = records behind it, name = open the division. */

/* ---- meetings by bucket: one stacked bar per row, every meeting connected to the period in exactly one segment ---- */
const BUCKETS = [{ k: 'h1', c: 'var(--m1)', ink: '#fff', n: 'Held, booked in period' }, { k: 'h2', c: 'var(--m2)', ink: '#fff', n: 'Held, booked earlier' },
  { k: 'up', c: 'var(--m3)', ink: 'var(--ink)', n: 'Upcoming' }, { k: 'nl', c: 'var(--m4)', ink: 'var(--ink)', n: 'Held earlier' }];
const bucketLegend = `<div class="legend" data-bleg>${BUCKETS.map(b => `<span data-b="${b.k}"><i style="background:${b.c}"></i>${b.n}</span>`).join('')}</div>`;
const DIVTAB = { 'North Zone': 'north', 'South Zone': 'south', 'West Zone': 'west', 'East Zone': 'east', USA: 'usa', Canada: 'canada', Australia: 'australia', Europe: 'europe', RoW: 'row' };
function meetBuckets(F, toks) {
  const pick = list => list.filter(r => own(r.owner, F) && (!toks || !toks.length || toks.every(t => `${r.org} ${r.deal} ${r.who} ${canon(r.owner)} ${r.division} ${r.type} ${r.purpose}`.toLowerCase().includes(t))));
  const held = pick(D.meet.held);
  return { h1: held.filter(r => r.bucket === 'h1'), h2: held.filter(r => r.bucket === 'h2'), up: pick(D.meet.upcoming).filter(r => r.bucket === 'up'), nl: pick(D.meet.nl || []) };
}
function meetGroups(by, F, bk4) {
  bk4 = bk4 || meetBuckets(F);
  const key = by === 'division' ? r => r.division : r => canon(r.owner);
  const names = new Set();
  BUCKETS.forEach(b => bk4[b.k].forEach(r => names.add(key(r))));
  if (by === 'owner') B.forEach(b => { if (!F || b.name === F) names.add(b.name); });
  else if (!F) Object.keys(DIVTAB).forEach(n => names.add(n));
  const groups = [...names].map(n => {
    const g = { name: n, onLabel: by === 'division' ? (DIVTAB[n] ? () => selectTab(DIVTAB[n]) : null) : () => openDrawer({ owner: n }) };
    BUCKETS.forEach(b => { g[b.k] = bk4[b.k].filter(r => key(r) === n); });
    g.booked = g.h1.length + g.up.length + g.nl.length; g.held = g.h1.length + g.h2.length;
    g.total = g.h1.length + g.h2.length + g.up.length + g.nl.length;
    g.all = [...g.h1, ...g.h2, ...g.up, ...g.nl];
    return g;
  });
  return groups.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
}
const metaText = g => [g.held && `${g.held} held`, g.up.length && `${g.up.length} upcoming`, g.nl.length && `${g.nl.length} not logged`].filter(Boolean).join(' · ');
function bucketChart(host, groups) {

    const tr = el('div', 'track m20');
    BUCKETS.forEach(b => {
      const list = g[b.k]; if (!list.length) return;

        `<b>${esc(g.name)}</b><br>${esc(b.n)}: ${list.length}`, () => meetPanel(b.k, list, `${g.name}: ${b.n.toLowerCase()}`));
      s.style.color = b.ink; tr.append(s);
    });
    host.append(hrow(g.name, tr, `<span class="mtot">${g.total}</span><span class="mtxt">${esc(metaText(g))}</span>`, g.onLabel, true));
  });
  if (!rows.length) host.append(el('div', 'empty-note', 'No meetings in the period.'));
  else if (zero.length) host.append(el('div', 'mnone', 'No meetings: ' + zero.map(g => esc(g.name)).join(', ')));
  // the legend above shows only the buckets that have values
  const card0 = host.closest('.card'), leg = card0 && card0.querySelector('[data-bleg]');
  if (leg) leg.querySelectorAll('[data-b]').forEach(sp => { sp.style.display = rows.some(g => g[sp.dataset.b].length) ? '' : 'none'; });
}
function bucketTable(host, groups, label) {
  const rows = groups.filter(g => g.total > 0);

function funnel(F) {

  const T5 = ['Hot', 'Warm', 'Mild', 'Cold', 'Untagged'];

/* ===================== charts (SVG) ===================== */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].find(m => m * p >= v) * p; }
function chartFrame(host, values, labels, dim) {
  const W = (dim && dim.W) || 300, H = (dim && dim.H) || 170, L = (dim && dim.L) || 34, R = (dim && dim.R) || 26, T = 18, Bm = 22;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img' }, host);
  const ymax = niceStep(Math.max(1, ...values) * 1.1 / 3) * 3;
